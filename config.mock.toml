# Mock 설정: 실제 API를 부르지 않는다 (비용 0원). 전체 루프 동작 확인용.
#   python -m chimera run --target mock_demo --config config.mock.toml

[limits]
max_cost_usd_per_run = 1.0
max_cost_usd_per_day = 3.0
max_tests_per_run = 40
max_model_calls_per_run = 200
max_wall_minutes = 10
max_consecutive_errors = 3

[loop]
probe_limit = 5
families_per_invariant = 3
repro_n = 3
deepen_limit = 6
stale_streak = 3
exploit_share_max = 0.5
recent_tests_in_context = 8
max_retries = 3
retry_base_delay_s = 0.01
retry_max_delay_s = 0.05

[models.mock-target]
provider = "mock"
model_id = "mock-target"
max_tokens = 1000
# Mock도 0이 아닌 가짜 단가를 넣어 예산 로직이 실제처럼 돌게 한다
input_usd_per_mtok = 1.0
output_usd_per_mtok = 5.0
price_source = "가짜 단가 (Mock)"

[models.mock-attacker]
provider = "mock"
model_id = "mock-attacker"
max_tokens = 4000
input_usd_per_mtok = 1.0
output_usd_per_mtok = 5.0
price_source = "가짜 단가 (Mock)"

[models.mock-judge]
provider = "mock"
model_id = "mock-judge"
max_tokens = 1000
input_usd_per_mtok = 1.0
output_usd_per_mtok = 5.0
price_source = "가짜 단가 (Mock)"

[roles]
attacker = "mock-attacker"
judge = "mock-judge"

[allowed]
targets = ["mock_demo"]

[paths]
data_dir = "data/mock"
targets_dir = "targets"
prompts_dir = "prompts"
