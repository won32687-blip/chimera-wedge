[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-wedge"
version = "0.1.0"
description = "CHIMERA 단일 WEDGE 루프 v0.1"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chimera = "chimera.cli:main"

[tool.setuptools]
packages = ["chimera", "chimera.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
